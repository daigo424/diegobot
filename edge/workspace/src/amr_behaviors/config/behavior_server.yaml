behavior_server:
  ros__parameters:
    arm_joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]
    # 探す・物を見続けるカメラ(head: 頭部カメラ、wrist: 手首カメラ)。つかむ・置くは、manipulatorが手首カメラで行う。
    view_camera: head
    # 頭部で探すときの(パン, チルト)。チルトは床の近くから遠くまでが1枚に入る角度で、パンは横の画角が少し重なる刻み。
    head_search_poses: [0.0, -0.45,
                        -0.8, -0.45,
                        0.8, -0.45,
                        -1.5, -0.45,
                        1.5, -0.45]
    # 頭部で見る間のアームの姿勢。手前にあると深度が抜けるため、待機の姿勢のまま付け根を左へよける。
    head_arm_pose: [-0.6, -1.65, 1.4, 0.8519, -1.5708]
    head_speed: 1.0  # rad/s
    # 以下のsearch_poses・gaze_*は手首カメラで探す・見続けるとき(view_camera: wrist)の設定。
    # 探すときの姿勢(5関節ずつ、この順に見る)。standbyの肩・肘・手首で、付け根を振って見る(隣の姿勢とカメラの写る
    # 範囲が少し重なる刻み)。床を見下ろす姿勢を足しても、写る範囲はほとんど広がらない。
    search_poses: [0.0, -1.65, 1.4, 0.8519, -1.5708,
                   -0.9, -1.65, 1.4, 0.8519, -1.5708,
                   0.9, -1.65, 1.4, 0.8519, -1.5708,
                   -1.8, -1.65, 1.4, 0.8519, -1.5708,
                   1.3, -1.65, 1.4, 0.8519, -1.5708]
    # 近づく間はカメラを物体へ向け続ける。肩・肘・手首のひねりはgaze_poseで固定し、gaze_jointsだけ動かす。
    gaze_pose: [0.0, -1.65, 1.3, 0.85, -1.5708]
    gaze_joints: [shoulder_pan, wrist_flex]
    # 手首をこれより曲げるとグリッパーが肩に当たる。
    gaze_wrist_limits: [0.3, 1.45]  # rad
    # 付け根をこれより右へ振るとグリッパーが頭部カメラアームに当たる。
    gaze_pan_limits: [-3.15, 0.5]  # rad
    gaze_period: 0.2  # s
    settle_time: 1.5  # s
    find_attempts: 4
    # 探す・見続けるときの確信度の下限。遠くの小さな物はobject_finderの既定値前後になり見落とすため下げる(色でも絞る)。
    search_min_score: 0.15
    # 既定の止まる位置(base_linkから前の距離)。manipulatorの見下ろす姿勢に写り、つかめる範囲の中ほど。
    standoff: 0.18  # m
    # 高さが水平の長辺のこの倍より大きい物は、manipulatorが横からつかむ(manipulator.yamlのside_ratioと揃える)。
    side_ratio: 1.2
    # 横からつかむ物を止める位置(base_linkでの前・左)。アームの正面で、manipulatorの横づかみが届く所。
    side_target: [0.28, 0.069]  # m
    # 名前で指定された物を見分けるときに止まる位置(base_linkから前)。手首カメラが車体に当たらず、見下ろしすぎない
    # 姿勢で物から0.2〜0.5mに置ける。近いと見下ろす角度が深くなり、VLMが違う物を選びやすい。
    view_standoff: 0.50  # m
    # 見分ける姿勢の逆運動学の初期値(付け根・肩・肘・手首の4関節ずつ)と、試す見下ろす角度(浅い方から)。
    view_seeds: [0.0, -1.65, 1.4, 0.85,
                 0.0, 1.575, -0.005, -1.193,
                 0.0, 0.0, 0.5, 0.5,
                 0.0, 0.8, 0.3, -0.6]
    view_angles: [5.0, 10.0, 15.0, 20.0, 25.0, 30.0, 35.0, 40.0, 45.0, 50.0, 55.0, 60.0]  # deg
    view_roll: -1.5708  # rad
    # 腕を前へ伸ばしすぎると肩が支えきれない(低く前を向く姿勢を限界にする)。
    view_max_shoulder: 1.575  # rad
    view_min_elbow: -0.005  # rad
    # 腕を前へ伸ばした姿勢では重さで肩が前へ下がるため、見分ける姿勢はこれだけ下げても車体に当たらないものにする。
    view_sag: 0.1  # rad
    # 名前の物でなかった候補を除いて、次の候補を確かめる回数の上限と、除く範囲(頭部カメラで測る位置は、
    # 車体の向きが変わると数cmずれる)。
    max_candidates: 4
    exclude_radius: 0.12  # m
    floor_z: -0.00945  # m
    # VLMの応答と1回のやり直しを待つ時間。
    resolve_timeout: 90.0  # s
    # 車軸の中点。差動二輪はここを中心に回る。
    rotation_center_x: 0.035  # m
    # 追っている物体の推定位置からこの距離以内の検出だけで更新する(似た物に乗り換えないため)。
    track_gate: 0.25  # m
    # 1回の検出で推定位置がこれより動くなら、続けて同じ所(この距離以内)に出るまで使わない。
    track_max_step: 0.08  # m
    # 近くに別の物が写っているとき、追跡で使う範囲をその物までの距離の半分に狭める(この値より狭めない)。
    track_min_gate: 0.04  # m
    # 近づくときは、前に見つけた場所(odom上)をまず見て、その近くに無ければ見回す。
    # 古い記憶は車体の位置の誤差が積もって当てにならないため使わない。
    sighting_max_age: 600.0  # s
    # 前に見つけた場所へカメラを向けたときに残る、画像の中心からのずれ(正規化座標)の上限。超えれば写らないとみなす。
    sighting_max_offset: 0.2
    lost_timeout: 3.0  # s
    approach_timeout: 90.0  # s
    turn_speed: 0.5  # rad/s
    min_turn_speed: 0.15  # rad/s
    # 物体の向きのずれがこれより大きければその場で回り、小さければ前進しながら向きを直す。
    turn_in_place_angle: 0.2  # rad
    yaw_tolerance: 0.05  # rad
    drive_speed: 0.10  # m/s
    min_drive_speed: 0.03  # m/s
    steer_gain: 1.5
    distance_tolerance: 0.015  # m
    # 前進中、車体の前端(front_x)からstop_distance以内、幅half_width以内にLiDARの点があれば止まる。
    front_x: 0.079  # m
    half_width: 0.17  # m
    stop_distance: 0.12  # m
    # 1回の近づく動作で走る距離の上限。誤った位置で遠くへ走り出さないため。
    max_drive: 1.5  # m
