# ydlidar_ros2_driverのparams/Tmini.yaml(T-mini Plusはこれを使うとREADMEにある)の値。range_minだけはデータシートの0.05m。
# portとframe_idはlidar.launch.xmlで渡す。
/**:
  ros__parameters:
    ignore_array: ""
    baudrate: 230400
    lidar_type: 1
    device_type: 0
    intensity: true
    intensity_bit: 8
    isSingleChannel: false
    frequency: 10.0
    sample_rate: 4
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: true
    inverted: true
    auto_reconnect: true
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 12.0
    range_min: 0.05
    invalid_range_is_inf: false
    debug: false
