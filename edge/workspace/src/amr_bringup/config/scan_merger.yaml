/**:
  ros__parameters:
    scan_topics: ["/lidar_front_right/scan_filtered", "/lidar_rear_left/scan_filtered"]
    scan_policies: [1, 1]
    merged_frame_id: base_link
    output_topic: /scan
    # 2台は10Hzで位相が揃っていないため、組になるスキャンの時刻差は最大で約50ms。
    sync_slop: 0.06
    angle_min: -3.14159
    angle_max: 3.14159
    # T-mini Plusの1周400点(0.9°)に合わせる。
    angle_increment: 0.015708
    scan_time: 0.1
    range_min: 0.05
    range_max: 12.0
