manipulator:
  ros__parameters:
    arm_joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]
    # 車体の前のつかめる範囲の床を、深度が取れる距離を保ち、画像の下側に写る指より上に写す姿勢。
    # 手首を曲げすぎるとグリッパーが肩に当たる。
    look_joints: [0.0, -1.65, 1.3, 1.3, -1.5708]
    # 逆運動学の初期値(5関節ずつ)。肘を上にした解に寄せる。
    ik_seeds: [0.0, -1.65, 1.3, 1.45, -1.5708,
               0.0, 1.0, -0.2, 0.8, -1.5708,
               0.0, 0.5, 0.6, 1.0, -1.5708,
               0.0, 0.0, 1.15, 0.41, -1.5708]
    grasp_roll: -1.5708
    # 物体の中心を置く点(tip_linkの座標系)。tip_linkは固定側の指先で、可動側は-x側から閉じてくる。
    # 指を開いたときの、両指の間の中央付近にする。
    tcp_offset: [-0.025, 0.0, 0.0]
    # 車体の前端より手前は車体に当たる。
    min_reach_x: 0.10
    pregrasp_height: 0.08  # m
    grasp_depth: 0.015  # m
    # 固定側の指先は道具点(gripper_frame_link)より少し下に出るため、床に当てない高さ。
    min_tool_z: 0.012  # m
    lift_height: 0.10  # m
    linear_speed: 0.03  # m/s
    # 止まってから撮った画像が届くまで待つ。
    settle_time: 1.5  # s
    find_attempts: 4
    # 確信度の下限。真上から見た積み木などは見え方で大きく揺れるため低めにし、色でも絞る。
    find_min_score: 0.15
    # 渡された対象の位置から、この距離以内に今の検出が無ければ、対象が無いとみなす。
    prior_gate: 0.06  # m
    # gripper_openで開いたときの指の内側の間隔(指の長さの中間で測った値)。物の短辺がこれから両側の余裕を引いた幅より広ければつかまない。
    grip_width: 0.05  # m
    grip_margin: 0.005  # m
    # 手首カメラで物の深度が取れないとき、頭部カメラの物のうち、手首カメラから物への視線にこの距離以内のものを同じ物とみなす。
    head_match_gate: 0.05  # m
    # 頭部カメラの視界をアームがふさぐときに、よけておく姿勢(behavior_serverのhead_arm_poseと同じ)。
    head_view_joints: [-0.6, -1.65, 1.4, 0.8519, -1.5708]
    # 高さが水平の長辺のこの倍より大きい物は、横からつかむ(端を真上からつかむと外れやすい)。
    side_ratio: 1.2
    # 横からつかむときに物の中心を置く点(tip_linkの座標系)。指先でつかむと背の高い物を弾いて倒すため指の奥(-z)にし、
    # side_gripper_openで開いた両指の中間(固定側の指先から-x)に置く。
    side_tcp_offset: [-0.032, 0.0, -0.045]
    # 手首カメラが付いている側(tip_linkの座標系)。横からつかむとき、この向きを上にしてカメラを床に当てない。
    side_up_axis: [0.0, 1.0, 0.0]
    # 水平から下へ傾ける角度。浅い方から試す。
    side_pitches: [0.0, 5.0, 10.0, 15.0, 20.0, 25.0, 30.0, 35.0, 40.0, 45.0]  # deg
    # 横からつかむ逆運動学の初期値(5関節ずつ)。1つ目は、物を近くで見分けるときの低く前を向く姿勢。
    side_seeds: [0.0, 1.575, -0.005, -1.193, -1.5708,
                 0.0, 1.73, -0.16, -1.35, 0.09,
                 0.0, 1.6, 0.38, -1.63, 0.21]
    # 物の手前この距離から、道具の向きに差し込む。指を広く開くため、指先が物の手前の面より奥から始めても物は指の間に入る。
    side_pregrasp: 0.04  # m
    # 指とグリッパーが床に当たらない、道具点の高さの下限。
    side_min_z: 0.03  # m
    # 横からつかむ高さ(床からの、物の高さに対する割合)。
    side_height_ratio: 0.7
    # 横からつかむときの開き。指を横に向けると開いても上から叩かないため、差し込むときに引っかけないよう広く開く。
    side_gripper_open: 1.2  # rad
    side_lift: 0.04  # m
    velocity_scaling: 0.5
    # 開きすぎると可動側の指先が固定側より高く上がり、閉じるときに物体を上から叩く。
    gripper_open: 0.7  # rad
    gripper_close: -0.1745  # rad
    # 閉じた後の位置がこれ以下なら何も挟んでいない。
    empty_grip_position: -0.10  # rad
    # base_linkでの床の高さ。
    floor_z: -0.00945  # m
    # PlaceObjectで位置を指定しないときに置く場所(base_linkでの前・左)。
    default_place: [0.18, 0.0]  # m
    # 置くとき、物の底が面からこの高さに来たところで離す。
    place_clearance: 0.005  # m
