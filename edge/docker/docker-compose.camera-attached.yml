services:
  diegobot:
    volumes:
      # libcameraはudev経由でカメラのメディアデバイスを列挙するため、コンテナにも
      # ホストのudevデータベースが見える必要がある(無いと/dev/media*があってもカメラを発見できない)。
      - /run/udev:/run/udev:ro
    # libcameraはIPA(画像処理アルゴリズム)を別プロセスにfork/execして分離する設計で、
    # DockerのデフォルトseccompプロファイルだとこのforkがENOSYS("Function not implemented")
    # で失敗する。seccompを外して許可する。
    security_opt:
      - seccomp:unconfined
